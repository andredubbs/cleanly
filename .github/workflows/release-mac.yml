name: Signed Mac package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      # Fail before any packaging/download if credentials are absent.
      - run: node scripts/preflight-release.mjs
      # Reviewed Electron installer only downloads the runtime; it never launches the app.
      - run: node node_modules/electron/install.js
      - run: npm run dist:mac -- --publish never
      # No automatic publication, tag-triggered release, unsigned fallback or user installation.
      - uses: actions/upload-artifact@v4
        with:
          name: signed-cleanly-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
